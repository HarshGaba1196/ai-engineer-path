  res:[["Spec","llms.txt","https://llmstxt.org/","A proposal for making sites readable by LLMs."],["Guide","Google developer documentation style guide","https://developers.google.com/style","Clear, consistent technical writing."],["Guide","Write the Docs guide","https://www.writethedocs.org/guide/","Community guide to documentation practice."]],
  build:{title:"Make a docs section AI-ready",steps:["Pick 10 pages of docs and ask an AI assistant 20 real user questions using only those pages.","Rewrite the pages so each section stands alone, with clear headings and consistent terms.","Add an llms.txt file that maps the content.","Ask the same 20 questions again and compare answer quality."]},
  quiz:[
   {q:"Why should each docs section make sense on its own?",o:["For SEO only","AI retrieval often pulls single sections without the rest of the page","It's shorter","Style guides require it"],a:1,e:"Retrieved chunks lose surrounding context. Self-contained sections give correct answers."},
   {q:"A section says 'as mentioned above, set it to true'. What's the problem for AI?",o:["Nothing","The chunk lacks what 'it' and 'above' refer to","It's too short","It's in English"],a:1,e:"Name the setting explicitly so the section works when read alone."},
   {q:"What is llms.txt?",o:["A licence file","A proposed file giving LLMs a concise map of a site's key content","A log file","A robots.txt replacement"],a:1,e:"It points AI tools to the most important, clean content on your site."},
   {q:"An AI draft of a how-to looks great. Before publishing you should…",o:["Publish it","Test every step and have a subject-matter expert review it","Run a spell check only","Add more adjectives"],a:1,e:"AI drafts can include plausible but wrong steps. Verify against the real product."},
   {q:"Using two different terms for the same feature mainly causes…",o:["Nothing","Confusion for readers and weaker retrieval for AI answers","Better SEO","Shorter pages"],a:1,e:"Consistent terminology helps both people and search find the right content."}]},
{ id:"knowledge", title:"Knowledge bases for AI assistants", weeks:"3 weeks",
  why:"Every company is building an assistant on top of its knowledge. Whoever owns that knowledge, its structure, freshness and accuracy, decides how good the assistant is. That's a perfect role for writers.",
  bridge:"You already manage information architecture and content lifecycles. For AI, the knowledge base becomes the assistant's brain, and gaps or outdated pages turn directly into wrong answers.",
  concepts:[["The assistant's knowledge pipeline","Sources, ingestion, retrieval and answers."],["Information architecture for RAG","Content types, taxonomy and metadata."],["Content freshness","Ownership, review dates, removing outdated content."],["Finding knowledge gaps","Analysing unanswered and badly answered questions."],["Evaluating assistant answers","Golden questions, accuracy and citation checks."],["Owning the assistant's voice","Answer style, tone and escalation wording."]],
  res:[["Framework","Diátaxis","https://diataxis.fr/","A systematic approach to documentation structure."],["Article","Anthropic: Contextual Retrieval","https://www.anthropic.com/news/contextual-retrieval","How retrieval quality improves answers."],["Docs","Claude: reduce hallucinations","https://docs.claude.com/en/docs/test-and-evaluate/strengthen-guardrails/reduce-hallucinations","Techniques for grounded answers."]],
  build:{title:"Audit and improve an assistant's knowledge",steps:["Collect 50 real questions users ask (support tickets, search logs or chat logs).","Check whether the knowledge base contains a correct, current answer for each.","Fix the top 10 gaps and add owners and review dates to the pages.","Create a golden set of 30 questions to re-test the assistant every month."]},

   {q:"What helps retrieval find the right content most?",o:["Long pages","Clear content types, metadata and consistent terms","More images","Fewer headings"],a:1,e:"Structure and metadata let retrieval filter and rank content accurately."},
   {q:"How do you find gaps in a knowledge base?",o:["Guess","Analyse questions the assistant couldn't answer or answered badly","Count pages","Ask the model"],a:1,e:"Unanswered questions show exactly what content is missing."},

   {q:"A good test that the assistant is improving is…",o:["More pages","A fixed set of golden questions scored for accuracy and citations over time","More users","Faster page loads"],a:1,e:"A stable test set shows whether changes actually improve answers."}]}

Object.assign(LESSONS, {
finetune:[
 {p:["Use prompting first, RAG for knowledge and freshness, and fine-tuning for behaviour: a consistent format, style or narrow skill that prompts can't reliably produce, or to make a small model match a big one on one task.","Fine-tuning is a poor way to add facts. They go stale, and the model can still blend them incorrectly."],
  try:"For three tasks in your work, decide between prompting, RAG and fine-tuning, with one reason each."},
 {p:["Training data is a set of conversations in chat format: system, user and the ideal assistant reply. Quality and consistency matter most; a few hundred excellent examples often beat thousands of noisy ones.","Hold out an evaluation set before training, and make sure it covers the variety of real inputs."],
  code:"{\"messages\": [\n  {\"role\": \"system\", \"content\": \"Extract ticket fields as JSON.\"},\n  {\"role\": \"user\", \"content\": \"My order #4411 arrived broken, need a refund\"},\n  {\"role\": \"assistant\", \"content\": \"{\\\"order\\\": \\\"4411\\\", \\\"issue\\\": \\\"damaged\\\", \\\"wants\\\": \\\"refund\\\"}\"}\n]}",
  try:"Write 20 high-quality training examples in chat JSONL format for a narrow task."},
 {p:["LoRA trains small adapter matrices on top of a frozen base model. QLoRA loads the base model in 4-bit to cut memory further, so 7B to 8B models fit on a single consumer GPU.","Key settings are rank (adapter size), learning rate and number of epochs. Watch eval loss to avoid overfitting."],
  code:"from peft import LoraConfig\nfrom trl import SFTTrainer, SFTConfig\n\npeft_config = LoraConfig(r=16, lora_alpha=32, lora_dropout=0.05, target_modules=\"all-linear\", task_type=\"CAUSAL_LM\")\ntrainer = SFTTrainer(model=model_id, train_dataset=train_ds, eval_dataset=eval_ds,\n                     peft_config=peft_config, args=SFTConfig(output_dir=\"out\", num_train_epochs=2, learning_rate=2e-4))\ntrainer.train()",
  try:"Run a short LoRA fine-tune on Colab or a cloud GPU with 200 examples."},
 {p:["Compare the fine-tuned model against strong baselines: the base model with a good prompt, and a large hosted model. Use the same held-out eval set and graders.","Also run a general check, such as simple instructions and safety prompts, to catch regressions outside your task."],
  try:"Evaluate base, prompted and fine-tuned models on the same 50 held-out examples."},
 {p:["Distillation trains a small model on outputs from a large model. Generate high-quality answers with the large model for many inputs, filter them, then fine-tune the small one.","It can cut cost and latency dramatically for narrow, high-volume tasks. Check the provider's terms on using outputs for training."],
  try:"Generate 300 outputs with a large model, filter the best, and fine-tune a small model on them."},
 {p:["Preference tuning teaches a model which of two answers is better. DPO uses pairs of chosen and rejected responses, and is simpler than full RLHF.","It's useful for style, helpfulness and tone, when you can collect comparisons from users or reviewers."],
  try:"Collect 50 pairs of better/worse answers for one task and describe what the model should learn from them."}],
aidelivery:[
 {p:["In AI projects, you don't know how good the result will be until you try. Quality depends on data, prompts and models, and improves through iteration rather than linear build steps.","Plan for discovery: expect the scope to shift as you learn what the model can and can't do."],
  try:"List three ways an AI project you know differs from a normal software project."},
 {p:["A typical AI team includes AI or ML engineers, a product owner, domain experts who define good outputs, people who review and label results, and platform or security support.","Domain experts are often the bottleneck. Book their time early for creating examples and reviewing outputs."],
  try:"Map the roles needed for an AI project and identify who would fill each in your organisation."},
 {p:["Start with a time-boxed feasibility spike, often one or two weeks, to test the approach on real examples. End it with a go/no-go gate.","After the spike, estimate in ranges and re-plan at each quality milestone rather than committing to a fixed date upfront."],
  try:"Write a two-week spike plan with a clear question and decision criteria."},
 {p:["Define milestones as quality targets: '80% on the eval set' for a pilot, '95% plus zero critical errors' for launch. The eval set becomes your shared definition of done.","Track the pass rate weekly; it shows real progress better than task burndown."],
  try:"Turn a feature-based roadmap into quality-based milestones for one AI project."},
 {p:["AI projects carry specific risks: quality below target, data access delays, rising usage costs, security issues like prompt injection, regulatory constraints and low adoption.","Give each risk an owner, a trigger and a mitigation, and review them at every milestone."],
  try:"Build a risk register with 8 AI-specific risks, owners and mitigations."},
 {p:["Report AI progress with a quality trend against target, the main failure types, cost per task and decisions you need from leadership.","Be honest about uncertainty. Leaders trust measured progress more than optimistic status colours."],
  try:"Draft a one-page status report for an AI project with a quality chart and two decisions needed."}],
aidocs:[
 {p:["AI assistants usually don't read whole pages. Docs are split into chunks, the most relevant chunks are retrieved, and the model answers from those.","So each section is often read alone, without the page title, the intro or what came 'above'."],
  try:"Pick a docs page and read one section in isolation. Does it still make sense?"},
 {p:["Write self-contained sections: start with a clear heading, name the product and feature explicitly, and avoid 'this', 'it' and 'as mentioned above' without a reference.","Use consistent terms everywhere, and put key facts like limits, defaults and versions in plain text, not only in images."],
  try:"Rewrite one long section into self-contained sections with explicit names and headings."},
 {p:["llms.txt is a proposed standard: a markdown file at your site root that lists your most important docs with short descriptions, so AI tools can find clean content.","Some teams also publish markdown versions of pages, which are easier for AI tools to read than complex HTML."],
  code:"# Acme Payments\n\n> Developer docs for the Acme Payments API.\n\n## Docs\n- [Quickstart](https://docs.acme.com/quickstart.md): Make your first payment in 5 minutes\n- [Authentication](https://docs.acme.com/auth.md): API keys and OAuth\n- [Webhooks](https://docs.acme.com/webhooks.md): Events, retries and signatures",
  try:"Write an llms.txt for a docs site you know, with 8 to 10 key links."},
 {p:["AI speeds up the writing workflow: first drafts from SME notes, restructuring, style-guide checks, summaries, release notes and translation.","Keep a prompt library aligned with your style guide, and treat outputs as drafts that you shape and verify."],
  try:"Create a prompt that checks a page against three rules from your style guide."},
 {p:["AI drafts can contain confident errors: steps that don't exist, wrong parameter names or outdated behaviour. Test every procedure against the real product and get SME review for technical claims.","Keep a single source of truth, and update it first, so AI tools and humans read the same facts."],
  try:"Have AI draft a how-to, then test each step and log every error you find."},
 {p:["Measure docs quality with search success, page feedback, support tickets that docs should have prevented, and the accuracy of AI answers built on your docs.","A fixed set of real user questions, re-tested regularly, is a simple and powerful quality metric."],
  try:"Write 20 real user questions and score how well your docs answer them today."}],
knowledge:[
 {p:["An assistant's knowledge pipeline has four stages: sources (docs, help center, policies), ingestion (cleaning and chunking), retrieval (finding relevant pieces) and answering (the model writes from them).","Most wrong answers trace back to the first two stages: missing, outdated or badly structured content."],
  try:"Draw the knowledge pipeline for an assistant at your company and list every content source."},
 {p:["Structure content by type: tutorials, how-to guides, reference and explanation, as in the Diátaxis framework. Each type answers a different kind of question.","Add metadata like product, version, audience and last reviewed date, so retrieval can filter and rank correctly."],
  try:"Tag 20 pages with content type, product, audience and review date."},
 {p:["Outdated content is the most common cause of wrong assistant answers. Give every page an owner and a review date, and archive or redirect content that's no longer true.","Connect content updates to product releases so changes reach the knowledge base quickly."],
  try:"Find the 10 oldest pages in a knowledge base and decide: update, merge or archive."},
 {p:["Unanswered and badly answered questions show exactly where knowledge is missing. Review assistant logs, thumbs-down feedback and escalations regularly.","Group them by topic and fix the biggest gaps first."],
  try:"Review 50 assistant conversations and list the top 5 knowledge gaps."},
 {p:["A golden set of questions with correct answers and source pages lets you test the assistant after every content change.","Score answers for correctness, completeness and whether they cite the right source."],
  try:"Write 20 golden questions with expected answers and the page each should cite."},
 {p:["Writers often own how the assistant sounds: answer length, tone, formatting and how it says 'I don't know' or hands over to a human.","Write these as clear guidelines with examples, and work with engineers to put them into the system prompt."],
  try:"Write answer style guidelines for an assistant, with two good and two bad example answers."}]

{ id:"vectordb", title:"Vector databases in production", weeks:"3 weeks",

vectordb:[
 {p:["pgvector adds a `vector(n)` column type and distance operators: `<->` for Euclidean, `<=>` for cosine and `<#>` for inner product. Each 1,536-dimension float vector takes about 6 KB, so storage grows fast.","Use `halfvec` to halve storage when precision allows, and keep metadata in normal columns next to the vector."],
  code:"CREATE EXTENSION IF NOT EXISTS vector;\nCREATE TABLE chunks (id bigserial PRIMARY KEY, tenant_id int, content text, embedding vector(1024));\nSELECT id FROM chunks ORDER BY embedding <=> $1 LIMIT 10;",
  try:"Create a vector table, insert 10,000 random vectors and run a top-10 query."},
 {p:["HNSW builds a navigable graph: fast, high-recall queries, but slower builds and more memory. IVFFlat clusters vectors into lists: faster builds and less memory, but recall depends on the number of lists and probes.","HNSW is the usual default; IVFFlat suits very large tables with tight memory."],
  code:"CREATE INDEX ON chunks USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64);\n-- or\nCREATE INDEX ON chunks USING ivfflat (embedding vector_cosine_ops) WITH (lists = 1000);",
  try:"Build both index types on the same table and compare build time and size."},
 {p:["Recall at k measures how many of the true top-k results the index returns. Compute exact results with the index disabled, then compare.","Tune at query time: `hnsw.ef_search` for HNSW and `ivfflat.probes` for IVFFlat. Higher values mean better recall and slower queries."],
  code:"SET hnsw.ef_search = 100;\nEXPLAIN ANALYZE SELECT id FROM chunks ORDER BY embedding <=> $1 LIMIT 10;",
  try:"Measure recall and latency for ef_search values of 40, 100 and 200."},
 {p:["Real queries filter by tenant, language or date. With ANN indexes, filters can shrink results below k; newer pgvector versions support iterative scans to keep searching.","Hybrid search combines vector similarity with full-text ranking in one SQL query, then merges with reciprocal rank fusion."],
  try:"Write a hybrid query that combines `ts_rank` and vector distance for 5 test questions."},
 {p:["Treat vector tables like any large table: partition by tenant or time, use read replicas for query load, and back them up.","Plan for full re-embedding when the model changes: build a new column or table in parallel, then switch over."],
  try:"Write a runbook for re-embedding a table with a new model without downtime."},
 {p:["Dedicated vector databases like Qdrant, Weaviate and Milvus offer advanced filtering, quantization and horizontal scaling.","Postgres is usually enough up to tens of millions of vectors and keeps data in one place. Choose by scale, team skills and operational cost."],
  try:"Compare pgvector and Qdrant for your use case on scale, features and operations."}],
itauto:[
 {p:["Ticket triage is the classic first AI automation: classify each ticket, set priority, route it to the right team and suggest a knowledge article.","Start with suggestions a technician confirms, then automate categories that prove reliable."],
  try:"Define 6 ticket categories and test AI classification on 30 past tickets."},
 {p:["A knowledge bot answers 'how do I…' questions from your IT knowledge base: VPN setup, password resets, printer issues.","Its quality depends on the articles, so clean up outdated ones and make each article answer one question clearly."],

 {p:["AI assistants write PowerShell, Bash and Python quickly. Always read the script, understand each command and test in a safe environment.","Use dry-run options like `-WhatIf`, log actions, and never paste secrets into prompts."],
  code:"# Ask AI for a draft, then review and test with -WhatIf first\nGet-ADUser -Filter {LastLogonDate -lt $cutoff} -SearchBase $ou |\n  Disable-ADAccount -WhatIf",
  try:"Have AI write a script for a routine task, then review it line by line and test it on a test group."},
 {p:["Rolling out tools like Microsoft 365 Copilot or Gemini for Workspace means licences, data access and training. The assistant sees what the user can see.","Run a pilot group, gather feedback and publish guides with real examples."],
  try:"Write a rollout plan for an AI assistant: pilot group, permissions review, training and feedback."},
 {p:["AI makes oversharing visible: if a file is shared with everyone, an assistant may surface it. Review sharing settings and sensitivity labels first.","Reduce shadow AI by offering approved tools and a simple policy people understand."],

{ id:"aigovpro", title:"Running an AI governance program", weeks:"3 weeks",

 {p:["AI extracts fields from invoices, receipts and contracts into a table: supplier, date, amount, tax and line items.","Use it to prepare data for a person to review, and keep approvals and bank-detail changes under strict human control."],

 {p:["AI can help match transactions, explain mismatches and flag unusual entries for review, such as duplicates, round amounts or odd timings.","Exceptions still need investigation by someone who knows the business."],

 {p:["Management reports need commentary explaining variances. AI can draft it from the numbers and your notes.","You must check that the explanation matches the real drivers; AI will invent plausible reasons otherwise."],

 {p:["AI helps with forecasting basics: spotting trends and seasonality, building scenarios and explaining assumptions in plain words.","Keep forecasts in your normal tools and treat AI suggestions as input to your judgement."],

 {p:["AI research tools speed up finding authorities and summarising law, but they can invent cases or misstate holdings.","Read every source yourself before relying on it. Courts have sanctioned lawyers for fake AI citations."],

 {p:["AI drafts clauses, suggests alternative wording and produces plain-language versions for clients.","Check every draft for accuracy, consistency with the rest of the document and your client's position."],

 {p:["Client confidentiality and privilege require approved tools with suitable data terms: no training on your data, appropriate retention and security.","Follow your firm's or company's AI policy and professional ethics guidance."],

 {p:["Git saves snapshots of your code (commits) so you can go back, try ideas on branches and collaborate. GitHub hosts your repositories online.","Commit small, meaningful changes with clear messages."],

function xp(){
  return lessonsDone()*20
    + Math.round(Object.values(state.quiz).reduce((a,v)=>a+v,0)*50)
    + buildsDone()*100
    + Math.round((state.exam||0)*150)
    + (state.bonus||0);
}
const rankName = l => l===RANKS.length-1 ? TRACK.rank : RANKS[l][1];
function levelInfo(x=xp()){
  const th=l=>Math.round(RANKS[l][0]*Math.max(0.5,PHASES.length/10));   // shorter paths need less XP per rank
  let l=0; while(l<RANKS.length-1 && x>=th(l+1)) l++;
  const lo=th(l), hi=l<RANKS.length-1?th(l+1):null;
  return {level:l+1, name:rankName(l), tag:RANKS[l][2], xp:x, next:hi, prog: hi==null?1:(x-lo)/(hi-lo), toNext: hi==null?0:hi-x};
}

/* streaks: one entry per local calendar day with activity */
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function recordDay(){ const t=dayKey(); root.days=root.days||[]; if(!root.days.includes(t)){ root.days.push(t); root.days=root.days.slice(-400); } }
function streak(){
  const set=new Set(root.days||[]); const d=new Date();
  if(!set.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0; while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function bestStreak(){
  const days=[...(root.days||[])].sort(); let best=0, run=0, prev=null;
  for(const k of days){ const t=new Date(k+"T12:00:00"); run = prev && (t-prev)/864e5<1.5 ? run+1 : 1; best=Math.max(best,run); prev=t; }
  return best;
}
const studiedToday = () => (root.days||[]).includes(dayKey());

/* XP earned per calendar day (all paths), used for the daily goal and the activity heatmap */
function logXp(){
  const now = xp();
  if(lastXp!=null && now>lastXp){
    const k=dayKey(), goal=root.goal||50;
    root.xpLog=root.xpLog||{};
    const before=root.xpLog[k]||0; root.xpLog[k]=before+(now-lastXp);
    const keys=Object.keys(root.xpLog).sort(); if(keys.length>400) delete root.xpLog[keys[0]];
    if(before<goal && root.xpLog[k]>=goal) setTimeout(()=>{ toast(`Daily goal reached: ${root.xpLog[k]} XP today`); confetti(90); }, 400);
  }
  lastXp = now;
}

/* confetti on a throwaway canvas */
function confetti(count=120){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"); cv.className="confetti"; document.body.appendChild(cv);
  const ctx=cv.getContext("2d"), dpr=devicePixelRatio||1, W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=["--accent","--xp","--flame","--good","--amber"].map(v=>cs.getPropertyValue(v).trim()||"#888");
  const ps=Array.from({length:count},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const p of ps){ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
    if(t-t0<2600) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

function seeded(seedStr){ let h=1779033703^seedStr.length; for(let i=0;i<seedStr.length;i++){ h=Math.imul(h^seedStr.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
function dailyItems(){
  const rnd=seeded("daily-"+dayKey()), pool=PHASES.flatMap((p,i)=>p.quiz.map(q=>({...q,from:i})));
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,5);
}

/* search: every word must match the role, skills, modules or topics of a path */
const hayCache={};
function haystack(t){
  if(hayCache[t.id]) return hayCache[t.id];
  const ps=trackPhases(t);
  const parts=[[t.from,"role"],[t.to,"role"],[t.short||"","role"],[t.tagline,"about"],[t.tech?"technical coding":"non-technical no coding","type"],
    ...t.stack.map(s=>[s,"skill"]), ...ps.map(p=>[p.title,"module"]), ...ps.flatMap(p=>p.concepts.map(c=>[c[0],"topic: "+p.title]))];
  return hayCache[t.id]=parts.map(([text,kind])=>({text, low:text.toLowerCase(), kind}));
}
function searchMatch(t, q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean); if(!words.length) return {ok:true};
  const hay=haystack(t); let why=null;
  for(const w of words){
    const hit=hay.find(h=>h.low.includes(w)); if(!hit) return {ok:false};
    if(!why && !["role","about","type"].includes(hit.kind)) why=hit;
  }
  return {ok:true, why};
}
function markText(text, q){
  let out=esc(text);
  q.toLowerCase().split(/\s+/).filter(w=>w.length>1).forEach(w=>{ out=out.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); });
  return out;
}

  const s=$("pathSearch"); if(s){ e.preventDefault(); s.focus(); s.scrollIntoView({behavior:"smooth",block:"center"}); }
});

/* ---------- state & storage ---------- */
const KEY = "ai-path-progress-v1";
const blank = () => ({concepts:{}, quiz:{}, build:{}, exam:null, history:[], bonus:0, flags:{}, badges:{}, daily:null});
/* root holds what's shared (chosen path, study days); each path has its own progress object, and `state` points at the current one */
let root = {v:2, track:null, days:[], paths:{}};
let state = blank();
function useTrackState(id){ root.paths[id] = Object.assign(blank(), root.paths[id]||{}); state = root.paths[id]; }
function migrate(o){
  if(!o) return {v:2, track:null, days:[], paths:{}};
  if(o.v===2) return Object.assign({v:2, track:null, days:[], paths:{}}, o);
  // v1 kept one progress object shared by every path: give each module's progress to exactly one path,
  // the active path if it has that module, otherwise the first path that does
  const r={v:2, track:o.track||null, days:o.days||[], paths:{}};
  const any=Object.keys(o.concepts||{}).length||Object.keys(o.quiz||{}).length||Object.keys(o.build||{}).length||o.exam!=null;
  if(!any) return r;
  r.track = r.track || "backend";
  const active=TRACKS.find(t=>t.id===r.track)||TRACKS[0];
  const owner=k=>active.modules.includes(k) ? active.id : TRACKS.find(t=>t.modules.includes(k))?.id;
  for(const t of TRACKS){
    const pick=obj=>Object.fromEntries(Object.entries(obj||{}).filter(([k])=>owner(k)===t.id));
    const p={...blank(), concepts:pick(o.concepts), quiz:pick(o.quiz), build:pick(o.build)};
    if(t.id===r.track) Object.assign(p,{exam:o.exam??null, history:o.history||[], bonus:o.bonus||0, flags:o.flags||{}, badges:o.badges||{}, daily:o.daily||null});
    if(t.id===r.track || Object.keys(p.concepts).length || Object.keys(p.quiz).length || Object.keys(p.build).length) r.paths[t.id]=p;
  }
  return r;
}
let docRef = null, saveTimer = null, quizRun = null, synced = false;

function loadLocal(){ try{ const s = localStorage.getItem(KEY); if(s) root = migrate(JSON.parse(s)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(root)); }catch(e){} }
function persist(){
  saveLocal();
  if(!docRef) return;
  clearTimeout(saveTimer);
  setSync("Saving…", synced);
  saveTimer = setTimeout(async ()=>{
    try{ await docRef.set({progress: JSON.stringify(root), updated: Date.now()}); setSync("Synced to your account", true); }
    catch(e){ setSync("Saved on this device · sync failed", false); }
  }, 600);
}
function setSync(t, ok){ synced = ok; document.getElementById("sync").innerHTML = `<span class="dot ${ok?"ok":""}"></span>${t}`; }
async function connect(){
  if(!window.claude?.use) return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    docRef = db.doc("data/users/" + uid + "/progress");
    const snap = await docRef.get();
    if(snap.exists){ root = migrate(JSON.parse(snap.data().progress || "{}")); saveLocal(); initTrack(); quietSync(); route(); }
    else if(hasProgress()) save();

  }catch(e){}
}

function mastery(i){ const x=parts(i); return 0.4*x.c + 0.4*(x.q??0) + 0.2*(x.b?1:0); }

/* ---------- routing ---------- */
function parse(){
  const h = location.hash.slice(1);
  if(h==="exam") return {name:"exam"};
  if(h==="exam-run") return {name:"examrun"};
  if(h==="daily") return {name:"daily"};
  if(h==="" || h==="paths" || h==="home") return {name:"paths"};
  if(h==="dashboard") return {name:"dashboard"};
  const pd = h.match(/^path-([a-z]+)$/); if(pd && trackById(pd[1])) return {name:"pathdetail", id:pd[1]};
  const l = h.match(/^p-([a-z]+)-l(\d)$/);
  if(l && idx(l[1])>=0 && +l[2] < PHASES[idx(l[1])].concepts.length) return {name:"lesson", id:l[1], k:+l[2]};
  const m = h.match(/^p-([a-z]+)(?:-(quiz|build))?$/);
  if(m && idx(m[1])>=0) return {name: m[2]||"phase", id:m[1]};
  return {name:"paths"};
}
function route(){
  let r = parse();
  const homeView = r.name==="paths" || r.name==="pathdetail";
  if(!homeView && !root.track){ history.replaceState(null, "", "#paths"); r = {name:"paths"}; }   // a course page needs a chosen path
  $("app").classList.toggle("home", r.name==="paths" || r.name==="pathdetail");
  $("app").classList.remove("open");

  const np = nextPhase();
  const cb = $("continueBtn");
  if(np==null){ cb.href="#exam"; cb.querySelector(".lbl").textContent="Fight the boss"; }
  else { const a=nextAction(np); cb.href=a.href; cb.querySelector(".lbl").textContent="Continue: phase "+(np+1); }
  const v = $("view");
  if(r.name==="pathdetail"){ const t=trackById(r.id); crumbs(["Paths", `${t.from} → ${t.to}`]); v.innerHTML = pathDetail(t); bindPaths(); return; }
  if(r.name==="paths"){ crumbs(["Choose your path"]); v.innerHTML = pathsView(); bindPaths(); return; }
  if(r.name==="dashboard"){ crumbs(["Dashboard"]); v.innerHTML = dashboard(); bindDashboard(); }

  else if(r.name==="examrun"){ if(quizRun?.mode!=="exam") startExam(); crumbs(["Boss battle","Fight"]); renderRunner(); }

  else if(r.name==="lesson"){

/* ---------- dashboard ---------- */
function curve(ms){
  const W=560,H=190,L=36,R=12,T=14,B=28,n=ms.length;
  const x=i=>L+(W-L-R)*i/n, y=v=>T+(H-T-B)*(1-v);
  let loss=1; const pts=[[x(0),y(1)]];
  ms.forEach((m,i)=>{ loss-=m/n; pts.push([x(i+1),y(Math.max(0,loss))]); });
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  let g="";
  [0,.25,.5,.75,1].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" font-family="var(--f-mono)" fill="var(--faint)">${v.toFixed(2)}</text>`; });
  for(let i=0;i<=n;i++) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" font-family="var(--f-mono)" fill="var(--faint)">${i===0?"start":i}</text>`;
  const last=pts[pts.length-1];
  return g+`<path d="M${x(0)} ${y(1)} L${x(n)} ${y(0)}" stroke="var(--faint)" stroke-dasharray="4 4" fill="none"/>`+
    `<path d="${line} L${x(n)} ${y(0)} L${x(0)} ${y(0)} Z" fill="var(--accent)" fill-opacity=".09"/>`+
    `<path d="${line}" stroke="var(--accent)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>`+
    `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`+
    `<text x="${last[0]-8}" y="${last[1]-10}" text-anchor="end" font-size="11" font-weight="600" font-family="var(--f-mono)" fill="var(--ink)">${Math.max(0,loss).toFixed(2)}</text>`;
}

const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
function md(src){
  return src.split(/```[a-zA-Z]*\n?/).map((part,i)=>{
    if(i%2) return `<pre class="code">${esc(part.replace(/\n$/,""))}</pre>`;
    const out=[]; let list=null;
    const flush=()=>{ if(list){ out.push(`<${list.t}>${list.items.join("")}</${list.t}>`); list=null; } };
    part.split("\n").forEach(line=>{
      const fmt = t => inline(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
      let m;
      if(!line.trim()){ flush(); return; }
      if((m=line.match(/^#{1,4}\s+(.*)/))){ flush(); out.push(`<h4>${fmt(m[1])}</h4>`); return; }
      if((m=line.match(/^\s*[-*]\s+(.*)/))){ if(!list||list.t!=="ul"){ flush(); list={t:"ul",items:[]}; } list.items.push(`<li>${fmt(m[1])}</li>`); return; }
      if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){ if(!list||list.t!=="ol"){ flush(); list={t:"ol",items:[]}; } list.items.push(`<li>${fmt(m[1])}</li>`); return; }
      flush(); out.push(`<p>${fmt(line)}</p>`);
    });
    flush(); return out.join("");
  }).join("");
}

async function askTutor(i,k,question,label){
  const p=PHASES[i], key=p.id+"-"+k, log=$("tLog");
  if(tutorCtl) return;
  const chat = tutorChats[key] = tutorChats[key]||[];
  const sample = window.claude?.use ? await claude.use("sample") : null;
  log.insertAdjacentHTML("beforeend", `<div class="tq">${esc(label||question)}</div><div class="ta" id="tLive"><p class="muted">Thinking…</p></div>`);
  const live=$("tLive"); live.removeAttribute("id");
  live.scrollIntoView({block:"nearest",behavior:"smooth"});
  if(!sample){ live.innerHTML=`<p class="muted">The tutor works when this page is open in Claude. Use the lesson's resources below meanwhile.</p>`; return; }
  const turns = chat.slice(-6).map(m=>({role:m.role, content:m.content}));
  const input = turns.length ? [{role:"user", content: tutorContext(i,k)+"\n\nFirst question: "+turns[0].content}, ...turns.slice(1), {role:"user", content:question}]
                             : tutorContext(i,k)+"\n\nQuestion: "+question;
  tutorCtl = new AbortController();
  $("tSend").disabled=true; $("tStop").hidden=false;
  let answer="";
  try{
    const res = await sample(input, {signal:tutorCtl.signal, cache:false, onText:({text})=>{ answer=text; live.innerHTML=md(text); }});
    answer=res.text; live.innerHTML=md(answer);
    chat.push({role:"user",content:question,show:label||question},{role:"assistant",content:answer});
    if(!F().tutor){ F().tutor=true; save(); }
  }catch(e){
    const msg = {not_granted:"You didn't allow this page to use Claude. Reload the page to be asked again.",
      rate_limited:"Too many questions at once. Wait a minute and try again.",
      cancelled:"Stopped.", prompt_too_large:"This chat got too long. Clear the chat and ask again.",
      sampling_disabled:"Claude access is turned off for this account.", capability_disabled:"Claude access is turned off for this page."}[e?.code]
      || "The tutor couldn't answer just now. Try again in a moment.";
    const kept = e?.text || answer;
    live.innerHTML = (kept?md(kept):"") + `<p class="terr">${esc(msg)}</p>`;
    if(kept && e?.code==="cancelled") chat.push({role:"user",content:question,show:label||question},{role:"assistant",content:kept});
  }finally{
    tutorCtl=null;
    if($("tSend")){ $("tSend").disabled=false; $("tStop").hidden=true; }
  }
}

/* ---------- quiz engine: phase quiz, daily challenge, boss battle ---------- */
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function prepQ(q){ const o=shuffle(q.o.map((_,i)=>i)); return {...q,o:o.map(i=>q.o[i]),a:o.indexOf(q.a)}; }
function newRun(mode, phase, items){ quizRun={mode, phase, items:items.map(prepQ), answers:[], pos:0, combo:0, best:0, hearts: mode==="exam"?3:null, t0:Date.now(), xp0:xp(), msg:null}; }
function startQuiz(i){ newRun("quiz", i, shuffle(PHASES[i].quiz)); }
function startExam(){ newRun("exam", -1, shuffle(PHASES.flatMap((p,i)=>p.quiz.map(q=>({...q,from:i})))).slice(0,15)); }
function startDaily(){ newRun("daily", -1, dailyItems()); }
function runnerEl(){ return quizRun.mode==="quiz" ? $("runner") : $("view"); }
const heart = full => `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.3 3.3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5c3.3 0 5.5 3.3 4.1 6.7C19.5 16.4 12 21 12 21z" fill="${full?"var(--bad)":"none"}" stroke="${full?"var(--bad)":"var(--faint)"}" stroke-width="1.8"/></svg>`;

function renderRunner(){
  const r=quizRun, el=runnerEl(); if(!el) return;
  const n=r.items.length, correct=r.answers.filter((a,i)=>a===r.items[i].a).length;
  if(r.pos>=n){ el.innerHTML = resultsHTML(r, correct, n); bindResults(r); return; }
  const q=r.items[r.pos], ans=r.answers[r.pos];
  const title = r.mode==="exam" ? `<div class="boss-h"><span class="label" style="color:var(--bad)">Boss battle</span><span class="hearts" aria-label="${r.hearts} lives left">${[0,1,2].map(h=>heart(h<r.hearts)).join("")}</span></div>`
              : r.mode==="daily" ? `<div class="boss-h"><span class="label" style="color:var(--flame)">Daily challenge · ${dayKey()}</span></div>` : "";
  el.innerHTML = `<div class="runner">${title}
    <div class="run-top"><span>Question <b class="num" style="color:var(--ink)">${r.pos+1}</b> of ${n}</span>
      <span class="combo ${r.combo>=2?"hot":""}" aria-live="polite">${r.combo>=2?flame(true)+` Combo ×${r.combo}`:`<span class="num">${correct}</span> correct`}</span></div>
    <div class="bar" style="margin-bottom:16px"><i style="width:${(r.pos+(ans!=null?1:0))/n*100}%"></i></div>
    <div class="card qcard ${ans!=null?(ans===q.a?"pop-ok":"shake"):""}">
      ${r.msg?`<div class="cheer ${ans===q.a?"ok":"no"}">${esc(r.msg)}</div>`:""}
      ${q.from!=null?`<div class="qmeta">Phase ${q.from+1} · ${esc(PHASES[q.from].title)}</div>`:""}
      <div class="qtext">${esc(q.q)}</div>
      ${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}
      <div class="opts">${q.o.map((o,k)=>{ let c=""; if(ans!=null){ c = k===q.a?"right":k===ans?"wrong":"dim"; } return `<button class="opt ${c}" data-k="${k}" ${ans!=null?"disabled":""}><kbd>${"ABCD"[k]}</kbd><span>${esc(o)}</span></button>`; }).join("")}</div>
      ${ans!=null?`<div class="feedback ${ans===q.a?"ok":"no"}"><b>${ans===q.a?"Correct":"Not quite"}</b>${esc(q.e)}</div>`:""}
    </div>
    <div class="run-foot"><span class="hint">Keyboard: A–D to answer, Enter for next</span>
      <button class="btn" id="nextQ" ${ans==null?"disabled":""}>${r.pos===n-1||r.hearts===0?"See results":"Next question"}</button></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("nextQ").onclick=advance;
}
function answer(k){
  const r=quizRun; if(r.pos>=r.items.length || r.answers[r.pos]!=null) return;
  r.answers[r.pos]=k;
  if(k===r.items[r.pos].a){ r.combo++; r.best=Math.max(r.best,r.combo); if(r.combo>=5) F().combo5=true; r.msg=r.combo>=3?`${pick(CHEERS)} · ×${r.combo}`:pick(CHEERS); }
  else { r.combo=0; r.msg=pick(OOPS); if(r.hearts!=null) r.hearts--; }
  if(r.hearts===0) for(let i=r.pos+1;i<r.items.length;i++) r.answers[i]=-1;   // out of lives: the rest count as missed
  if(r.answers.filter(a=>a!=null).length===r.items.length) finish();
  renderRunner(); $("nextQ")?.focus();
}
function advance(){ const r=quizRun; if(r.answers[r.pos]==null) return; r.pos = r.hearts===0 ? r.items.length : r.pos+1; r.msg=null; renderRunner(); renderNav(parse()); scrollTo({top:0}); }
function finish(){
  const r=quizRun, c=r.answers.filter((a,i)=>a===r.items[i].a).length, s=c/r.items.length;
  r.secs=Math.round((Date.now()-r.t0)/1000);
  if(r.mode==="daily"){
    if(!dailyDone()){ state.daily={date:dayKey(), s, c}; state.bonus=(state.bonus||0)+c*15; F().daily=true; }
  } else {
    state.history=(state.history||[]).concat({k:r.mode==="exam"?"e":"q",p:r.mode==="exam"?null:PHASES[r.phase].id,s,at:Date.now()}).slice(-50);
    if(r.mode==="exam") state.exam=Math.max(state.exam??0,s);
    else { const id=PHASES[r.phase].id; state.quiz[id]=Math.max(state.quiz[id]??0,s); if(s>=0.8 && r.secs<60) F().speed=true; }
  }
  r.gained = null;
  save();
  r.gained = xp()-r.xp0;
  if(s===1) setTimeout(()=>confetti(160),300);
}

  return `<div class="runner" style="display:flex;flex-direction:column;gap:20px">
    <div class="card result">${ring(s,96,9,"var(--line)",s>=0.8?"var(--good)":s>=0.5?"var(--amber)":"var(--bad)")}
      <div class="big num">${correct}/${n}</div>

        <span><b class="num">${r.gained>0?"+"+r.gained:"0"}</b>XP earned</span>

        <span><b class="num">${r.secs>=60?Math.floor(r.secs/60)+"m "+(r.secs%60)+"s":r.secs+"s"}</b>time</span>
        ${prevBest!=null?`<span><b class="num">${pct(Math.max(prevBest,s))}</b>best score</span>`:""}
      </div>
      ${daily?`<p class="muted">Next challenge in about ${hoursToMidnight()} hours. Come back tomorrow to keep your streak.</p>`:""}
      ${r.gained===0&&!daily?`<p class="muted" style="font-size:13px">XP comes from your best score, so beat it to earn more.</p>`:""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px">${actions}</div></div>
    <div class="card"><div class="card-h"><h2>Review answers</h2></div>
      <ul class="review">${r.items.map((q,i)=>{ const a=r.answers[i], ok=a===q.a; return `<li><span class="mk ${ok?"ok":"no"}">${ok?"✓":"✗"}</span><div><p class="q">${esc(q.q)}</p>${ok?"":a>=0?`<p><span class="muted">Your answer:</span> ${esc(q.o[a])}</p>`:`<p class="muted">Not reached</p>`}<p><span class="muted">Correct:</span> ${esc(q.o[q.a])}</p><p class="muted" style="margin-top:4px">${esc(q.e)}</p></div></li>`; }).join("")}</ul></div></div>`;
}
function bindResults(r){ const b=$("again"); if(b) b.onclick=()=>{ r.mode==="exam"?startExam():startQuiz(r.phase); renderRunner(); scrollTo({top:0}); }; }
document.addEventListener("keydown",e=>{
  if(!$("levelup").hidden && e.key==="Escape"){ $("levelup").hidden=true; return; }
  if(!quizRun || !document.querySelector(".qcard") || e.metaKey||e.ctrlKey||e.altKey || e.target.tagName==="TEXTAREA") return;
  const k="abcd".indexOf(e.key.toLowerCase());
  if(k>=0 && k<quizRun.items[quizRun.pos]?.o.length){ answer(k); e.preventDefault(); }
  else if(e.key==="Enter" && quizRun.answers[quizRun.pos]!=null && document.activeElement?.tagName!=="A"){ advance(); e.preventDefault(); }
});

/* ---------- boss lair ---------- */
function examHome(){
  const ex=(state.history||[]).filter(h=>h.k==="e").slice(-8).reverse();
  return `<div class="boss-hero card"><div class="boss-glyph num" aria-hidden="true">♛</div><div>
      <div class="label" style="color:var(--bad)">Final boss</div><h1 style="margin-top:4px">The Checkpoint</h1>
      <p class="muted" style="margin-top:6px;max-width:60ch">15 random questions from all ${PHASES.length} phases of your path. You have 3 lives: each wrong answer costs one, and losing all three ends the fight. Score 80% to defeat the boss and earn the Boss slayer badge.</p>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center"><button class="btn danger-btn" id="startExam">Enter the battle</button><span class="hearts">${heart(1)}${heart(1)}${heart(1)}</span></div></div></div>
    <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="card kpi"><div class="label">Best score</div><b>${state.exam!=null?pct(state.exam):"–"}</b><small>${(state.exam||0)>=0.8?"Boss defeated":"80% to win"}</small></div>
      <div class="card kpi"><div class="label">Attempts</div><b>${(state.history||[]).filter(h=>h.k==="e").length}</b></div>
      <div class="card kpi"><div class="label">Question pool</div><b>${PHASES.reduce((a,p)=>a+p.quiz.length,0)}</b></div>
    </div>
    <div class="card"><div class="card-h"><h2>Past battles</h2></div>
      ${ex.length?`<ul class="hist">${ex.map(h=>`<li><span>${fmtDate(h.at)}</span><span class="pill ${h.s>=0.8?"good":h.s>=0.5?"warn":""}">${h.s>=0.8?"Victory · ":""}${pct(h.s)}</span></li>`).join("")}</ul>`:`<p class="empty">No battles yet. Your results will appear here.</p>`}</div>`;
}
function bindExamHome(){ $("startExam").onclick=()=>{ startExam(); go("exam-run"); }; }

/* ---------- shell ---------- */
$("menuBtn").onclick=()=>$("app").classList.add("open");
$("scrim").onclick=()=>$("app").classList.remove("open");
$("resetBox").addEventListener("click",e=>{
  const box=$("resetBox");
  if(e.target.id==="resetBtn") box.innerHTML=`<div class="confirm"><span>Erase progress on this path?</span><button class="danger" id="resetYes">Erase</button><button id="resetNo">Cancel</button></div>`;
  else if(e.target.id==="resetNo") box.innerHTML=`<button class="linkbtn" id="resetBtn">Reset progress</button>`;
  else if(e.target.id==="resetYes"){ root.paths[TRACK.id]=blank(); useTrackState(TRACK.id); quizRun=null; lastLevel=null; lastXp=xp(); persist(); renderPlayer(); box.innerHTML=`<button class="linkbtn" id="resetBtn">Reset progress</button>`; route(); toast("Path progress reset"); }
});
addEventListener("hashchange",()=>{ route(); scrollTo({top:0}); });
loadLocal(); initTrack(); quietSync();
route(); connect();
</script>
