<title>AI Career Paths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Fixed sidebar (brand, nav, curriculum, account), main column with a top bar and routed views: Dashboard, Phase, Quiz runner, Exam. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#f8f9fc; --ink:#121826; --muted:#5b6478; --faint:#8b93a7; --line:#e3e7ef;
  --accent:#3155e6; --accent-ink:#ffffff; --accent-soft:#e9eefd; --amber:#a86400; --amber-soft:#fdf1df;
  --good:#16794a; --good-soft:#e3f4ea; --bad:#b3312c; --bad-soft:#fbe8e7; --xp:#7442e0; --xp-soft:#efe8fd; --flame:#e2590f; --flame-soft:#fdebdf; --rose:#cc2f6a; --teal:#0b8079; --sky:#1f6fc5; --plum:#9334b0; --lime:#4f7d00; --slate:#4b5b7a; --indigo:#4338ca; --cyan:#0e7490; --brown:#8b5e34; --mint:#047857; --side:#0f1424; --side-ink:#c9cfdd; --side-muted:#7c859b; --side-line:#222a40; --side-hover:#1a2136;
  --shadow:0 1px 2px rgba(18,24,38,.05),0 4px 16px rgba(18,24,38,.05);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-ui:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a; --surface:#131929; --surface-2:#171e30; --ink:#e7eaf2; --muted:#9aa3b8; --faint:#6f788e; --line:#252d43;
  --accent:#7f98ff; --accent-ink:#0b0f1a; --accent-soft:#1d2750; --amber:#f2aa45; --amber-soft:#33250f;
  --good:#4cc488; --good-soft:#123222; --bad:#ff7d76; --bad-soft:#3a1a1c; --xp:#b192ff; --xp-soft:#2a1f4d; --flame:#ff8a3d; --flame-soft:#3a2111; --rose:#ff7aa8; --teal:#3fd0c4; --sky:#6cb8ff; --plum:#d58bf0; --lime:#a8e05f; --slate:#a9b8d6; --indigo:#a5b4fc; --cyan:#67e8f9; --brown:#e0b088; --mint:#6ee7b7; --side:#080b14; --side-ink:#c9cfdd; --side-muted:#6f788e; --side-line:#1b2236; --side-hover:#131a2b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#131929; --surface-2:#171e30; --ink:#e7eaf2; --muted:#9aa3b8; --faint:#6f788e; --line:#252d43;
  --accent:#7f98ff; --accent-ink:#0b0f1a; --accent-soft:#1d2750; --amber:#f2aa45; --amber-soft:#33250f;
  --good:#4cc488; --good-soft:#123222; --bad:#ff7d76; --bad-soft:#3a1a1c; --xp:#b192ff; --xp-soft:#2a1f4d; --flame:#ff8a3d; --flame-soft:#3a2111; --rose:#ff7aa8; --teal:#3fd0c4; --sky:#6cb8ff; --plum:#d58bf0; --lime:#a8e05f; --slate:#a9b8d6; --indigo:#a5b4fc; --cyan:#67e8f9; --brown:#e0b088; --mint:#6ee7b7; --side:#080b14; --side-ink:#c9cfdd; --side-muted:#6f788e; --side-line:#1b2236; --side-hover:#131a2b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.015em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700;font-family:var(--f-ui)}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font:700 15px var(--f-display);color:#fff;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:16px 10px 6px}
.nav a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--side-ink);text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:var(--side-hover)}
.nav a.on{background:var(--side-hover);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.nav a .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a .m{font:11px var(--f-mono);color:var(--side-muted)}
.nav a.on .m{color:var(--side-ink)}
.ring{width:20px;height:20px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--side-muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--side-muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:#4cc488}
.linkbtn{background:none;border:0;padding:0;color:var(--side-muted);text-align:left;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--side-ink)}
.confirm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.confirm button{border:1px solid var(--side-line);background:var(--side-hover);border-radius:6px;padding:3px 8px;font-size:12px}
.confirm .danger{border-color:#b3312c;color:#ff8f88}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.crumbs{font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.view{padding:28px;max-width:1200px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* components */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--faint)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:18px 20px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-ui);padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.bar.good i{background:var(--good)}

/* dashboard */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero p{margin-top:6px;max-width:64ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px}
.kpi b{display:block;font:600 26px var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
#curve{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;background:var(--accent);vertical-align:3px;margin-right:6px}
.legend i.d{background:none;border-top:2px dashed var(--faint);height:0}
.next{display:flex;flex-direction:column;gap:14px}
.next .ph-n{font:600 12px var(--f-mono);color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.chk.on{background:var(--good);border-color:var(--good)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{text-align:left;font:600 11px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td .t{font-weight:600}
td .w{font-size:12px;color:var(--muted)}
td.r{text-align:right}
.mcell{display:grid;grid-template-columns:minmax(60px,1fr) 40px;gap:10px;align-items:center}

/* phase view */
.ph-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
.ph-head p{margin-top:8px;max-width:70ch}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.bridge{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px}
.bridge svg{flex:none;margin-top:2px}
.bridge .label{color:var(--accent)}
.bridge p{margin-top:4px}
.concepts{list-style:none;margin:0;padding:0}
.concepts li+li{border-top:1px solid var(--line)}
.concepts label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:12px 20px;cursor:pointer}
.concepts label:hover{background:var(--surface-2)}
.concepts input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--good)}
.concepts b{font-weight:600}
.concepts .d{display:block;color:var(--muted);font-size:14px}
.res{list-style:none;margin:0;padding:0}
.res li+li{border-top:1px solid var(--line)}
.res a{display:grid;grid-template-columns:76px minmax(0,1fr) 16px;gap:12px;align-items:center;padding:12px 20px;text-decoration:none;color:var(--ink)}
.res a:hover{background:var(--surface-2)}
.res .k{font:600 10.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:3px 6px;text-align:center}
.res b{font-weight:600;display:block}
.res span.d{color:var(--muted);font-size:13.5px}
.aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.score-big{display:flex;align-items:center;gap:14px}
.pager{display:flex;justify-content:space-between;gap:10px}
.pager .btn{flex:1;justify-content:center}
.task ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column}
.task li{counter-increment:s;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 20px}
.task li+li{border-top:1px solid var(--line)}
.task li::before{content:counter(s);font:600 12px var(--f-mono);width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.done-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r);cursor:pointer}
.done-row input{width:18px;height:18px;accent-color:var(--good)}

/* quiz runner */
.runner{max-width:760px;width:100%;margin:0 auto}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qcard{padding:24px}
.qmeta{font:600 12px var(--f-ui);color:var(--accent);margin-bottom:8px}
.qtext{font:600 19px/1.4 var(--f-ui);margin-bottom:16px}
pre.code{font:13.5px/1.55 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;font-size:15px}
.opt kbd{font:600 12px var(--f-mono);width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right kbd{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong kbd{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.dim{opacity:.6}
.feedback{margin-top:16px;padding:14px 16px;border-radius:9px;font-size:14.5px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:2px}
.run-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--faint)}
.result{text-align:center;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .big{font:600 44px var(--f-mono)}
.review{list-style:none;margin:0;padding:0}
.review li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:14px 20px}
.review li+li{border-top:1px solid var(--line)}
.review .mk{font:700 14px var(--f-mono)}
.review .mk.ok{color:var(--good)} .review .mk.no{color:var(--bad)}
.review p{font-size:14px}
.review .q{font-weight:600;font-size:14.5px;margin-bottom:2px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:10px 20px;font-size:14px}
.hist li+li{border-top:1px solid var(--line)}
.empty{padding:22px 20px;color:var(--muted);font-size:14px}
/* lessons & tutor */
code{font:0.88em var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
pre.code code{all:unset}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding-left:20px}
.lrow input{margin-top:16px}
.lrow a{display:grid;grid-template-columns:minmax(0,1fr) 16px;gap:10px;align-items:center;padding:12px 20px 12px 0;color:var(--ink);text-decoration:none}
.lrow:hover{background:var(--surface-2)}
.lrow .ln{display:block;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.lesson .card-b{display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.7}
.lesson .card-b>p{max-width:70ch}
.lesson pre.code{margin:0;font-size:13px}
.try{background:var(--amber-soft);border-radius:8px;padding:14px 16px}
.try p{margin-top:4px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.tlog{display:flex;flex-direction:column;gap:12px}
.tlog:empty{display:none}
.tq{align-self:flex-end;max-width:85%;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:12px 12px 2px 12px;font-size:14.5px;font-weight:500}
.ta{background:var(--surface-2);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:12px 16px;font-size:14.5px;line-height:1.65;min-width:0;display:flex;flex-direction:column;gap:8px}
.ta ul,.ta ol{margin:0;padding-left:20px}
.ta h4{margin:4px 0 0;font-size:14.5px}
.ta pre.code{margin:0}
.terr{color:var(--bad);font-size:13.5px}
.tform{display:flex;flex-direction:column;gap:8px}
.tform textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;min-height:52px;width:100%}
.tform textarea:focus{outline:none;border-color:var(--accent)}
.tactions{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tactions .hint{margin-right:auto}
.lnav{list-style:none;margin:0;padding:6px 0}
.lnav a{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:center;padding:8px 20px;font-size:14px;color:var(--ink);text-decoration:none}
.lnav a:hover{background:var(--surface-2)}
.lnav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.method{list-style:none;margin:0;padding:6px 0;counter-reset:m;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.method li{counter-increment:m;padding:14px 20px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.method li::before{content:counter(m);font:600 12px var(--f-mono);color:var(--accent);margin-bottom:4px}
@media (max-width:820px){ .method{grid-template-columns:1fr} }
/* game layer */
.player{margin:0 4px 6px;padding:12px;border:1px solid var(--side-line);border-radius:10px;background:var(--side-hover);display:flex;flex-direction:column;gap:9px}
.pl-top{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center}
.pl-lvl{width:36px;height:36px;border-radius:9px;background:var(--xp);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.pl-top b{display:block;color:#fff;font-size:14px}
.pl-top span{font-size:11.5px;color:var(--side-muted)}
.pl-bar{height:5px;background:var(--side-line);border-radius:99px;overflow:hidden}
.pl-bar i{display:block;height:100%;background:var(--xp);border-radius:99px;transition:width .5s}
.pl-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--side-muted)}
.pl-stats span{display:inline-flex;align-items:center;gap:4px}
.pl-stats b{color:var(--side-ink)}
.chips-top{display:flex;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.tchip.lit{color:var(--flame);border-color:var(--flame-soft);background:var(--flame-soft)}
.tchip.xpchip{color:var(--xp);background:var(--xp-soft);border-color:transparent}
.bar.xp i{background:var(--xp)}
.player-banner{display:grid;grid-template-columns:auto minmax(0,1fr) 230px;gap:28px;align-items:center;padding:24px 26px;background:linear-gradient(120deg,var(--xp-soft),var(--surface) 55%)}

.sc-route{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:16px;border-radius:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 14%,var(--surface)),var(--surface) 75%);border:1px solid color-mix(in srgb,var(--c) 25%,var(--line))}
.sc-from{display:flex;align-items:center;gap:12px;grid-column:1/-1}
.sc-from small,.sc-to small{display:block;font:600 10.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sc-from b{font-size:16px}
.sc-from .pc-glyph{background:var(--c)}
.sc-arrow{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding-left:18px}
.sc-line{width:3px;height:30px;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--c) 0 6px,transparent 6px 11px);background-size:100% 22px;animation:drip 1s linear infinite}
@keyframes drip{to{background-position:0 22px}}
.sc-weeks{font-size:12px;color:var(--muted)}
.sc-to{grid-column:1/-1}
.sc-typed{font-size:clamp(24px,3vw,32px);color:var(--c);min-height:1.2em}
.sc-typed.typing::after{content:"";display:inline-block;width:3px;height:.9em;background:var(--c);margin-left:3px;vertical-align:-2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sc-skills{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sc-chip{font-size:12.5px;padding:4px 10px;border-radius:99px;animation:chipIn .4s both;animation-delay:calc(var(--d) * 70ms + 150ms)}
@keyframes chipIn{from{transform:translateY(8px) scale(.9)}}
.sc-chip.keep{background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.sc-chip.add{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);color:var(--ink);font-weight:600}
.sc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:16px}
.sc-foot .btn{background:var(--c);border-color:var(--c);color:#fff}
.sc-prog{height:3px;background:var(--line);margin:0 -20px}
.sc-prog i{display:block;height:100%;width:0;background:var(--xp);transition:width .1s linear}
@media (max-width:560px){ .sc-skills{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .sc-body,.sc-chip,.sc-line{animation:none} }
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:1060px){ .layout,.grid2{grid-template-columns:1fr} .aside{position:static} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .menu{display:inline-grid;place-items:center}
  .topbar{padding-left:16px;padding-right:16px}
  .view{padding:20px 16px}
  .topbar .btn .lbl{display:none}
}
@media (max-width:440px){ .kpi b{font-size:22px} .qcard{padding:18px} .qtext{font-size:17px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const MODULES = [
{ id:"py", title:"Python for AI work", weeks:"3 weeks",
  why:"Almost every AI library, notebook and paper is Python-first. You need fluent, idiomatic Python, not just syntax.",
  bridge:"FastAPI is your Spring Boot here: decorators instead of annotations, Pydantic models instead of DTOs with Bean Validation, uvicorn instead of embedded Tomcat. venv + pip/uv plays the role of Maven.",
  concepts:[
    ["Idiomatic Python","Comprehensions, generators, unpacking, f-strings, dataclasses, type hints."],
    ["Environments & packaging","venv or uv, requirements/pyproject.toml, pinning versions."],
    ["NumPy & pandas","Vectorized arrays, broadcasting, DataFrames, groupby, reading CSV/Parquet."],
    ["Jupyter notebooks","Exploratory work, plotting with matplotlib, when not to use notebooks."],
    ["FastAPI + Pydantic","Typed request/response models, dependency injection, OpenAPI docs."],
    ["asyncio","async/await for I/O-bound calls like model APIs; when to use threads or processes instead."]],
  res:[["Course","Python official tutorial","https://docs.python.org/3/tutorial/","Skim chapters 3 to 9 for idioms."],
       ["Docs","NumPy for absolute beginners","https://numpy.org/doc/stable/user/absolute_beginners.html","Arrays, shapes, broadcasting."],
       ["Docs","FastAPI tutorial","https://fastapi.tiangolo.com/tutorial/","Will feel familiar after Spring."]],
  build:{title:"Port a Spring endpoint to FastAPI",steps:["Pick a small REST resource you built in Spring Boot (for example, an Order with GET/POST).","Rebuild it in FastAPI with Pydantic models, validation and a dependency-injected repository.","Add an async endpoint that calls two external HTTP APIs concurrently with httpx and asyncio.gather.","Load a CSV into pandas, compute three aggregates, and expose them via an endpoint."]},
  quiz:[
   {q:"What does this print?",code:"print([x * 2 for x in range(4) if x % 2])",o:["[0, 2, 4, 6]","[2, 6]","[1, 3]","[0, 4]"],a:1,e:"range(4) is 0,1,2,3. The filter keeps odd values 1 and 3, which double to 2 and 6."},
   {q:"In FastAPI, what replaces Spring's @RestController + @GetMapping(\"/items\")?",o:["A class extending APIRouter with a get() override","A function decorated with @app.get(\"/items\")","An XML route config file","A Pydantic BaseModel"],a:1,e:"FastAPI maps routes with decorators on plain functions. Pydantic models describe the bodies, not the routes."},
   {q:"Why is a NumPy operation like a * b much faster than a Python loop over lists?",o:["NumPy runs on the GPU by default","It runs a compiled C loop over contiguous typed memory","Python lists are immutable","NumPy caches results"],a:1,e:"Vectorized NumPy ops avoid per-element Python overhead. GPU use needs libraries like PyTorch or CuPy."},
   {q:"You call 5 LLM APIs that each take 2 seconds. Which approach finishes fastest in a single Python process?",o:["A for loop with requests.get","asyncio.gather over async httpx calls","multiprocessing with 1 worker","time.sleep between calls to avoid rate limits"],a:1,e:"The work is I/O-bound, so async concurrency overlaps the waits. Total time is close to 2 seconds instead of 10."},
   {q:"What is the closest Java analogy to a Python virtual environment?",o:["The JVM heap","A project's own resolved dependency set, isolated from other projects","A Spring profile","A Docker volume"],a:1,e:"A venv isolates one project's installed packages, much like each Maven/Gradle project resolving its own dependencies."}]},
{ id:"math", title:"Math you actually need", weeks:"3 weeks",
  why:"You don't need a math degree, but vectors, probability and gradients show up in every embedding, loss function and training loop.",
  bridge:"Think of an embedding as a fixed-length double[] that encodes meaning. Similarity search is just comparing those arrays. Gradient descent is an optimization loop, like a retry-with-adjustment that converges.",
  concepts:[
    ["Vectors & dot product","Magnitude, dot product, cosine similarity."],
    ["Matrices","Matrix multiply as a batch of dot products; shapes like (batch, features)."],
    ["Probability basics","Distributions, conditional probability, expectation, Bayes' rule."],
    ["Derivatives & gradients","Slope, partial derivatives, chain rule."],
    ["Gradient descent","Learning rate, local minima, mini-batches."],
    ["Softmax & cross-entropy","Turning scores into probabilities and measuring prediction error."]],
  res:[["Video","3Blue1Brown: Essence of linear algebra","https://www.3blue1brown.com/topics/linear-algebra","The best visual intuition available."],
       ["Video","3Blue1Brown: Neural networks","https://www.3blue1brown.com/topics/neural-networks","Gradient descent and backprop, visually."],
       ["Course","Khan Academy: Statistics and probability","https://www.khanacademy.org/math/statistics-probability","Pick the probability units."]],
  build:{title:"Gradient descent from scratch",steps:["In NumPy, write cosine_similarity(a, b) and test it on a few hand-made vectors.","Generate noisy points along y = 3x + 2.","Fit w and b with your own gradient descent loop (no libraries). Print the loss every 50 steps.","Try learning rates 0.0001, 0.01 and 1.0 and write one line on what happens with each."]},
  quiz:[
   {q:"What is [1, 2, 3] · [4, 5, 6]?",o:["21","32","[4, 10, 18]","15"],a:1,e:"1×4 + 2×5 + 3×6 = 4 + 10 + 18 = 32. The element-wise product would be [4, 10, 18]."},
   {q:"Two embeddings have cosine similarity close to 1.0. What does that mean?",o:["They are orthogonal","They point in nearly the same direction, so the meanings are similar","One is the negative of the other","They have the same length"],a:1,e:"Cosine similarity measures the angle, not length. 1 means same direction, 0 unrelated, −1 opposite."},
   {q:"In gradient descent, which way do you move the weights?",o:["Along the gradient","Opposite the gradient","Perpendicular to the gradient","Randomly, scaled by the gradient"],a:1,e:"The gradient points to the steepest increase in loss, so you step the other way to reduce loss."},
   {q:"Your training loss jumps around and then shoots to NaN. Most likely cause?",o:["Learning rate too high","Learning rate too low","Too much training data","Too few features"],a:0,e:"A step size that is too large overshoots the minimum and can diverge. Too low just makes training slow."},
   {q:"What does softmax do to a vector of logits?",o:["Sorts them","Turns them into probabilities that sum to 1","Keeps only the max value","Normalizes them to unit length"],a:1,e:"Softmax exponentiates and normalizes, giving a probability distribution. LLMs use it to pick the next token."}]},
{ id:"ml", title:"Classical machine learning", weeks:"4 weeks",
  why:"Many real problems are still best solved with simple models. This phase also teaches the vocabulary of training, validation and metrics that everything later reuses.",
  bridge:"A trained model is a pure function you can deploy behind a REST endpoint. Train/test splits are like keeping a test suite the code never sees during development.",
  concepts:[
    ["Supervised vs unsupervised","Classification, regression, clustering."],
    ["Train / validation / test splits","Why you never tune on the test set; cross-validation."],
    ["Overfitting & regularization","Bias vs variance, L2, early stopping."],
    ["Metrics","Accuracy, precision, recall, F1, ROC-AUC, MAE/RMSE."],
    ["Feature engineering","Encoding categories, scaling, handling missing data."],
    ["Common models","Linear/logistic regression, decision trees, random forests, gradient boosting."]],
  res:[["Course","Machine Learning Specialization (Andrew Ng)","https://www.coursera.org/specializations/machine-learning-introduction","The classic, updated for Python."],
       ["Docs","scikit-learn tutorials","https://scikit-learn.org/stable/tutorial/index.html","Hands-on with the standard library."],
       ["Practice","Kaggle Learn","https://www.kaggle.com/learn","Short courses with real datasets."]],
  build:{title:"Train, evaluate and serve a classifier",steps:["Pick a tabular dataset (Titanic or a churn dataset on Kaggle).","Train logistic regression and a random forest with scikit-learn. Use a held-out test set.","Report precision, recall and F1, and explain which one matters for this problem.","Save the model with joblib and serve /predict from FastAPI. Call it from a Spring Boot service."]},
  quiz:[
   {q:"Training accuracy is 99% but test accuracy is 70%. What is happening?",o:["Underfitting","Overfitting","Data leakage into the test set","The test set is too large"],a:1,e:"The model memorized the training data and fails to generalize. Try regularization, more data or a simpler model."},
   {q:"Predicting a house's sale price is which kind of task?",o:["Classification","Regression","Clustering","Reinforcement learning"],a:1,e:"The output is a continuous number, so it is regression."},
   {q:"1% of transactions are fraud. A model always predicts \"not fraud\". Which metric exposes how bad it is?",o:["Accuracy","Recall on the fraud class","Training loss","Number of features"],a:1,e:"Accuracy would be 99%. Recall on fraud is 0%, because it catches none of them."},
   {q:"Why should you never tune hyperparameters on the test set?",o:["It makes training slower","The test score then overestimates real-world performance","scikit-learn forbids it","Test sets have no labels"],a:1,e:"Tuning against the test set leaks information into your choices. Use a validation set or cross-validation instead."},
   {q:"K-means clustering is an example of…",o:["Supervised learning","Unsupervised learning","A neural network","A regression metric"],a:1,e:"K-means groups unlabeled data by similarity. No target labels are involved."}]},
{ id:"dl", title:"Deep learning & PyTorch", weeks:"5 weeks",
  why:"LLMs are neural networks. Knowing how training loops, layers and backprop work lets you reason about fine-tuning, embeddings and model behaviour instead of treating them as magic.",
  bridge:"A PyTorch model is a class with a forward() method, similar to a service with one main operation. The training loop is a batch job: load a batch, compute, update state, repeat.",
  concepts:[
    ["Neurons & layers","Weights, biases, activations like ReLU."],
    ["Backpropagation","Chain rule applied through the computation graph."],
    ["The training loop","Forward pass, loss, backward, optimizer step, zero_grad."],
    ["Tensors & GPUs","Shapes, dtypes, moving tensors to cuda/mps."],
    ["Architectures","MLPs, CNNs for images, RNNs and why transformers replaced them."],
    ["Regularization","Dropout, weight decay, batch/layer norm."]],
  res:[["Video","Andrej Karpathy: Neural Networks Zero to Hero","https://karpathy.ai/zero-to-hero.html","Build micrograd and a small GPT yourself."],
       ["Course","fast.ai Practical Deep Learning","https://course.fast.ai/","Top-down and practical."],
       ["Docs","PyTorch: Learn the basics","https://pytorch.org/tutorials/beginner/basics/intro.html","Tensors, datasets, training loop."]],
  build:{title:"MNIST classifier with a loss curve",steps:["Follow Karpathy's micrograd video and build the tiny autograd engine.","Write a PyTorch MLP that classifies MNIST digits. Write the training loop yourself.","Plot training and validation loss per epoch. Add dropout and compare.","Export the model and serve it from FastAPI. Send a test image from Angular."]},
  quiz:[
   {q:"What does backpropagation compute?",o:["The model's predictions","The gradient of the loss with respect to every weight","The best learning rate","The training data's mean"],a:1,e:"Backprop uses the chain rule to get each weight's gradient. The optimizer then uses those gradients to update weights."},
   {q:"Why do neural networks need non-linear activations like ReLU?",o:["To speed up the GPU","Without them, stacked layers collapse into one linear function","To normalize inputs","To prevent overfitting"],a:1,e:"A composition of linear maps is still linear. Non-linearities let deep networks represent complex functions."},
   {q:"Why does the training loop call optimizer.zero_grad() each step?",code:"for x, y in loader:\n    optimizer.zero_grad()\n    loss = loss_fn(model(x), y)\n    loss.backward()\n    optimizer.step()",o:["To reset the weights","Because PyTorch accumulates gradients by default","To free GPU memory","To shuffle the batch"],a:1,e:"Without zeroing, gradients from previous batches add up and the updates become wrong."},
   {q:"What is one epoch?",o:["One weight update","One full pass over the training dataset","One batch","One hour of training"],a:1,e:"An epoch is a pass over all training examples, usually made of many batches and many weight updates."},
   {q:"What does dropout do during training?",o:["Removes bad training examples","Randomly zeroes some activations to reduce overfitting","Lowers the learning rate","Drops the last layer"],a:1,e:"Dropout forces the network not to rely on any single neuron. It is turned off at inference time."}]},
{ id:"llm", title:"Transformers & LLMs", weeks:"3 weeks",
  why:"This is the core of modern AI engineering. Understanding tokens, attention, context windows and sampling explains most LLM behaviour you will debug in production.",
  bridge:"Tokens are the billing and capacity unit, like request size limits on an API gateway. The context window is the model's whole working memory per request. Nothing persists between calls unless you send it.",
  concepts:[
    ["Tokenization","Subword tokens, why counts differ from words, cost implications."],
    ["Embeddings","Dense vectors that represent tokens or whole texts."],
    ["Self-attention","Each token weighs every other token in the context."],
    ["Pretraining vs fine-tuning","Next-token prediction, instruction tuning, RLHF, LoRA."],
    ["Sampling","Temperature, top-p, max tokens, stop sequences."],
    ["Context windows & limits","Input + output tokens, long-context trade-offs, hallucination."]],
  res:[["Article","The Illustrated Transformer","https://jalammar.github.io/illustrated-transformer/","The standard visual walkthrough."],
       ["Course","Hugging Face LLM Course","https://huggingface.co/learn/llm-course","Transformers library, tokenizers, fine-tuning."],
       ["Video","Karpathy: Let's build GPT","https://karpathy.ai/zero-to-hero.html","Last lectures of Zero to Hero."]],
  build:{title:"Look inside a model",steps:["Use a Hugging Face tokenizer to tokenize English text, code and Hindi. Compare token counts.","Run a small open model locally with Ollama and call it over HTTP from a Spring Boot app.","Generate the same answer at temperature 0 and 1, five times each. Record what changes.","Compute sentence embeddings for 20 sentences and print the 3 nearest neighbours for each."]},
  quiz:[
   {q:"What is an LLM trained to do during pretraining?",o:["Answer questions correctly","Predict the next token","Classify sentiment","Retrieve documents"],a:1,e:"Pretraining is next-token prediction over huge text corpora. Instruction-following comes from later tuning."},
   {q:"What does self-attention let each token do?",o:["Look up facts in a database","Weigh information from other tokens in the context when building its representation","Skip unimportant layers","Compress the prompt"],a:1,e:"Attention computes how much each token should draw from every other token. That is how context shapes meaning."},
   {q:"You need repeatable output for the same input. What should you set?",o:["Temperature high","Temperature low (near 0)","More max tokens","A longer system prompt"],a:1,e:"Low temperature makes sampling nearly greedy, so outputs vary much less. It still isn't a hard guarantee."},
   {q:"What counts against the context window?",o:["Only the user's latest message","System prompt, conversation history, tool results and the generated output","Only the output","Only images"],a:1,e:"Everything sent plus everything generated shares the window. Long histories crowd out room for the answer."},
   {q:"What is LoRA?",o:["A vector database","A parameter-efficient fine-tuning method that trains small low-rank adapter matrices","A tokenizer","A prompt template language"],a:1,e:"LoRA freezes the base weights and trains small adapters. It makes fine-tuning cheap enough for one GPU."}]},
{ id:"api", title:"Building with LLM APIs", weeks:"3 weeks",
  why:"Most AI engineering work is integrating hosted models into products: prompts, structured output, tool calls, streaming and cost control. Your backend skills matter most here.",
  bridge:"Spring AI and LangChain4j let you call models from Java with ChatClient, much like RestTemplate or WebClient. Tool calling is a remote procedure call that the model asks you to make.",
  concepts:[
    ["Prompt design","Clear instructions, examples (few-shot), roles, delimiting input data."],
    ["System prompts","Persistent rules, persona and context for the whole conversation."],
    ["Structured output","JSON schemas, validation, retries on bad output."],
    ["Tool / function calling","Model requests a call, your code executes it, result goes back."],
    ["Streaming","Server-sent events, time to first token, rendering in Angular."],
    ["Cost & latency","Token budgeting, model choice per task, batching, prompt caching."]],
  res:[["Docs","Claude prompt engineering guide","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview","Practical techniques with examples."],
       ["Docs","Spring AI reference","https://docs.spring.io/spring-ai/reference/","LLM calls from Spring Boot."],
       ["Docs","LangChain4j","https://docs.langchain4j.dev/","Alternative Java framework."]],
  build:{title:"Ticket triage service in Spring Boot",steps:["Build a Spring Boot service with Spring AI that reads a support ticket and returns JSON: category, priority, summary.","Validate the JSON against a record class. Retry once with the error message if it fails.","Add a tool the model can call: lookupCustomer(email) that hits your own DB.","Stream a draft reply over SSE to an Angular page. Log tokens and cost per request."]},
  quiz:[
   {q:"A chat API call doesn't remember the previous turn. Why?",o:["The model's memory is full","LLM APIs are stateless; you resend the conversation history each request","Streaming was off","The system prompt expired"],a:1,e:"Each request is independent. Your app stores history and sends the relevant part every time."},
   {q:"What is the most reliable way to get machine-parseable output?",o:["Ask politely for JSON","Use structured output or a tool schema, then validate in code","Set temperature to 2","Parse the text with regex"],a:1,e:"Schema-constrained output plus validation (and a retry path) is robust. Hoping the model formats correctly is not."},
   {q:"In tool calling, who executes the tool?",o:["The model provider's servers","Your application code, which then returns the result to the model","The user's browser","Nobody; the model imagines the result"],a:1,e:"The model only emits a structured request. Your code runs it and sends back a tool result message."},
   {q:"Main user-facing benefit of streaming responses?",o:["Lower total cost","Lower time to first token, so the UI feels faster","Higher accuracy","Larger context window"],a:1,e:"Total generation time is similar, but users see text immediately instead of waiting for the whole answer."},
   {q:"Where should untrusted user-uploaded text go in a prompt?",o:["Mixed into the system prompt","Clearly delimited (for example in tags) and treated as data, not instructions","Nowhere; never use user input","At the very beginning, before instructions"],a:1,e:"Delimiting input reduces confusion and injection risk. You still need other defenses, covered in phase 10."}]},
{ id:"rag", title:"RAG & vector search", weeks:"4 weeks",
  why:"Retrieval-augmented generation is the most common production pattern: answer questions over company data without retraining a model.",
  bridge:"RAG is a search service plus a template. You already know Postgres: pgvector adds a vector column and similarity index, so retrieval can live next to your existing data.",
  concepts:[
    ["The RAG pipeline","Ingest → chunk → embed → store → retrieve → generate with citations."],
    ["Chunking","Size, overlap, structure-aware splitting (headings, code blocks)."],
    ["Vector databases","pgvector, Qdrant, ANN indexes like HNSW."],
    ["Hybrid search","Combine BM25 keyword search with vector search."],
    ["Re-ranking","A second model reorders top candidates for precision."],
    ["Debugging RAG","Separate retrieval failures from generation failures."]],
  res:[["Docs","pgvector","https://github.com/pgvector/pgvector","Vector search in Postgres."],
       ["Article","Anthropic: Contextual Retrieval","https://www.anthropic.com/news/contextual-retrieval","Improving chunk retrieval in practice."],
       ["Docs","Spring AI: RAG","https://docs.spring.io/spring-ai/reference/api/retrieval-augmented-generation.html","RAG advisors in Spring."]],
  build:{title:"Docs Q&A with citations",steps:["Collect 50+ internal or public docs (for example, Spring Boot docs pages).","Chunk them, embed them, and store vectors in Postgres with pgvector.","Build /ask in Spring Boot: retrieve top 8 chunks, answer with citations to the source chunks.","Add BM25 (Postgres full-text) and merge with vector results. Compare answers for 10 questions."]},
  quiz:[
   {q:"What problem does RAG mainly solve?",o:["Making models faster","Grounding answers in private or fresh data without retraining","Reducing token costs to zero","Training a new model"],a:1,e:"RAG injects relevant retrieved text into the prompt, so the model can answer from your data."},
   {q:"Users search for error code \"ERR-4012\" and vector search misses it. Best fix?",o:["Bigger embedding model","Add keyword (hybrid) search","Raise temperature","Use smaller chunks only"],a:1,e:"Exact identifiers are weak in embeddings. Keyword search like BM25 catches them, so combine both."},
   {q:"The bot gives a wrong answer. What should you check first?",o:["Whether the retrieved chunks actually contained the answer","Whether the model is the newest","The Angular UI","The temperature"],a:0,e:"If retrieval missed, no prompt fix helps. Split the failure into retrieval vs generation before changing anything."},
   {q:"What does a re-ranker do?",o:["Re-embeds the whole corpus","Scores each query-chunk pair and reorders the top candidates","Sorts results by date","Deletes duplicate chunks"],a:1,e:"Re-rankers (cross-encoders) are slower but more precise, so they run on a small candidate set from the first retrieval."},
   {q:"Chunks are very large (whole 20-page documents). Likely effect?",o:["Better precision","Retrieval is less precise and wastes context window on irrelevant text","Faster embeddings with no downside","Nothing changes"],a:1,e:"Big chunks dilute the embedding's meaning and fill the context with noise. Very small chunks lose context, so tune the size."}]},
{ id:"agents", title:"Agents, tools & MCP", weeks:"4 weeks",
  why:"Agents let models take multi-step actions with tools. Knowing when to use them, and how to keep them safe and debuggable, is a core AI engineering skill.",
  bridge:"An agent is an orchestrator loop, like a saga coordinator where the model picks the next step. An MCP server is a microservice that exposes tools and data to any model client over a standard protocol.",
  concepts:[
    ["Workflows vs agents","Fixed chains and routers vs model-driven loops."],
    ["The agent loop","Think → call tool → observe → repeat until done or a limit."],

    ["Model Context Protocol","Servers expose tools/resources/prompts; clients connect to them."],
    ["Memory & state","Conversation summaries, scratchpads, persisting task state."],
    ["Guardrails","Step limits, permissions, human approval for risky actions."]],
  res:[["Article","Anthropic: Building effective agents","https://www.anthropic.com/research/building-effective-agents","When to use workflows vs agents."],
       ["Docs","Model Context Protocol","https://modelcontextprotocol.io/","Spec, SDKs including Java."],
       ["Docs","Spring AI: MCP","https://docs.spring.io/spring-ai/reference/api/mcp/mcp-overview.html","MCP servers and clients in Spring."]],
  build:{title:"Customer support agent with an MCP server",steps:["Write an MCP server in Spring Boot exposing three tools: searchOrders, getRefundPolicy, createTicket.","Build an agent loop that uses them to resolve a customer message. Cap it at 8 steps.","Require human approval before createTicket runs. Log each step as a trace.","Connect the same MCP server to Claude Desktop or Claude Code and use it there."]},
  quiz:[
   {q:"When should you prefer a fixed workflow over an autonomous agent?",o:["When steps are known and predictable","Never; agents are always better","When you have many tools","When latency doesn't matter"],a:0,e:"Workflows are cheaper, faster and easier to test. Use agents when the path truly can't be known in advance."},
   {q:"What is the Model Context Protocol (MCP)?",o:["A fine-tuning method","An open protocol for connecting AI apps to tools and data through servers","A vector index type","A prompt format"],a:1,e:"MCP standardizes how clients discover and call tools and resources, so one server works with many apps."},
   {q:"Which tool definition will the model use most reliably?",o:["name: \"do_it\", no description","name: \"search_orders\", a clear description, typed params and examples","One tool that takes a free-text command","Ten tools with the same description"],a:1,e:"The model chooses tools from names and descriptions. Treat them like a public API's documentation."},
   {q:"An agent can run SQL against production. What is the most important safeguard?",o:["A longer system prompt","Least-privilege access plus human approval for writes","Higher temperature","More tools"],a:1,e:"Prompts are not security boundaries. Restrict permissions in code and require approval for destructive actions."},
   {q:"Why cap the number of agent loop iterations?",o:["Models can't count","To stop runaway loops that burn cost and time","MCP requires it","It improves accuracy"],a:1,e:"Agents can get stuck retrying. A step budget with a clear failure path keeps cost and latency bounded."}]},
